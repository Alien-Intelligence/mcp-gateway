# TEST FIXTURE ONLY: spreads requests over the two gateway replicas, one request at a time, and
# changes nothing about them. One worker keeps the round robin strict (each worker would count on
# its own), which makes a request sequence alternate between the replicas.
worker_processes 1;
# File descriptors for the worker_connections below (a client and an upstream socket each).
worker_rlimit_nofile 8192;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # One worker serves every connection of the load test: a client connection and an upstream
    # connection per stream, so 2 x the largest concurrency run (hundreds of streams) plus the
    # kept-alive upstream connections. The 256 nginx defaults to ran out at 200 streams
    # ("worker_connections are not enough") and dropped clients.
    worker_connections 4096;
}

http {
    access_log /dev/stdout;

    upstream gateway_replicas {
        server gateway-ha-a:8000;
        server gateway-ha-b:8000;
        # HTTP/1.1 connections kept idle to the replicas, as a production load balancer would.
        # Sized for the load test: when N streams end together, N upstream connections go idle
        # at once and the next N requests should reuse them; with fewer kept, most of them
        # would open new connections and the measurement would include the connect cost.
        keepalive 512;
    }

    server {
        listen 8080;

        # Answered by nginx itself: the compose healthcheck of this service.
        location = /_lb/health {
            return 200;
        }

        location / {
            proxy_pass http://gateway_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The client's own Host (with the port): the gateway's public URL is built from config,
            # but a proxy that rewrote Host would hide a bug that depends on it.
            proxy_set_header Host $http_host;
            # Streams (SSE) and request bodies go through unbuffered.
            proxy_buffering off;
            proxy_request_buffering off;
            # Above the gateway's upstream read timeout (130 s): the gateway ends a silent
            # stream before this proxy does.
            proxy_read_timeout 150s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}

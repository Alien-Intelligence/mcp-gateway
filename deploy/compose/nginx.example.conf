# TLS termination in front of the gateway, which compose.yaml publishes on 127.0.0.1:8000.
# MCP over Streamable HTTP answers with Server-Sent Events: nothing between the client and the
# gateway may buffer, compress or time out a response that is still streaming.
#
# http2 on: needs nginx 1.25.1 or later (older: "listen 443 ssl http2;").
#
# Only the MCP endpoint (the path of public_url) and its protected-resource metadata document
# (/.well-known/oauth-protected-resource<path>) are published. /healthz and /readyz stay on the
# loopback port for the host's own probes; everything else answers 404 here. Change /mcp (twice) in the
# location pattern below when public_url has another path.

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/ssl/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/mcp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        return 404;
    }

    location ~ ^(/mcp|/\.well-known/oauth-protected-resource/mcp)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Relay every event as it arrives, in both directions.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        # Longer than any silence on a stream: the gateway ends an upstream that is silent for
        # upstreams.*.read_timeout_seconds (130 s in the examples); a GET listen stream can stay
        # idle longer than that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # The gateway refuses larger bodies itself (limits.max_request_body_bytes).
        client_max_body_size 1m;
    }
}

# GitLab CI/CD for mcp-gateway.
# Tests, lint, security scans, and the image: built for linux/amd64 and linux/arm64, pushed and scanned
# from the release flow. Nothing deploys the image from here yet, so there is no gitops-update job.

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'alias3/datastreaming/ci-scripts'
    ref: main
    file:
      - '/templates/stages.gitlab-ci.yml'
      - '/templates/jobs/release.gitlab-ci.yml'
      - '/templates/jobs/python-test.gitlab-ci.yml'
      - '/templates/jobs/python-lint.gitlab-ci.yml'
      - '/templates/jobs/docker.gitlab-ci.yml'

# One pipeline per change: a branch push is skipped while the branch has an open merge request
# (its merge request pipeline runs instead).
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

variables:
  REGISTRY: "rg.fr-par.scw.cloud/ns-data-streaming"
  REGISTRY_HOST: "rg.fr-par.scw.cloud"
  IMAGE_NAME: "mcp-gateway"
  # Versioning: the release bot bumps after merge (ci-scripts docs/VERSIONING.md)
  VBUMP_RELEASE_BRANCH: "dev"
  GIT_SUBMODULE_STRATEGY: none
  PYTHON_VERSION: "3.12"
  PYTHON_EXTRAS: "--extra dev"
  WITH_TYPE_CHECK: "true"
  LINT_DIRS: "src/ tests/ scripts/ dev/"
  # Unit tests only: the integration, e2e_stub (job e2e-stub) and e2e (local, README) suites need
  # the compose stack.
  PYTEST_MARKER: "not e2e and not e2e_stub and not integration"

# The stack and the harness, end to end, on every push that changes code, tests, the stack or the
# lockfile: real Keycloak and Hydra, the gateways, the credential backends, the telemetry
# collector and the fault-injection upstream stub (compose stub target). The harness
# runs in a container on the host network of the Docker daemon (the dind service), so the
# localhost issuers resolve as on a laptop. The steps live in scripts/ci_e2e_stub.sh, which also
# runs inside a local docker:dind container (README): run it there before pushing, CI minutes
# are paid. The stub target holds fake keys only, so the artifacts hold no secret.
.e2e-changes: &e2e-changes
  - src/**/*
  - tests/**/*
  - scripts/**/*
  - dev/**/*
  - compose*.yaml
  - Dockerfile*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.dind:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ARTIFACTS_DIR: artifacts
    UP_TIMEOUT_SECONDS: "420"
  before_script:
    - for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - docker info >/dev/null
    - docker version
    - docker compose version

e2e-stub:
  extends: .dind
  variables:
    RUN_TIMEOUT_SECONDS: "900"
  timeout: 25m
  script:
    - sh scripts/ci_e2e_stub.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/
    reports:
      junit: artifacts/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *e2e-changes
    - if: '$CI_COMMIT_BRANCH'
      changes: *e2e-changes

# The real-dev suite (pytest -m e2e): the same stack against the real dev MCP server and the Alien
# dev platform, which meters the calls. Merge requests and the default branch only, never a push
# to dev: it takes about a quarter of an hour and bills a few dev calls. The inputs are CI
# variables (names in README.md, "CI"); the personas' keys, the sponsor service account's key and
# the fixture are File-type variables, protected, so the job gets them on protected refs only.
# One run at a time: the suite reads each call back as the single new event in the shared
# dev feeds. The artifacts hold evidence (ids, claims) and the compose logs: developers only.
e2e-dev:
  extends: .dind
  variables:
    RUN_TIMEOUT_SECONDS: "1500"
  timeout: 40m
  resource_group: e2e-dev
  script:
    - sh scripts/ci_e2e_dev.sh
  artifacts:
    when: always
    access: developer
    expire_in: 1 week
    paths:
      - artifacts/
    reports:
      junit: artifacts/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *e2e-changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *e2e-changes

# The image. The shared `docker-build` job (ci-scripts docker.gitlab-ci.yml) builds with Kaniko, which
# builds one architecture per job and publishes no SBOM or provenance, so it is redeclared here: GitLab
# merges this over the shared job, which keeps its `rules:` (the post-merge release hold: on the
# release branch only the release bot's commit publishes, with the branch -> tag scheme the other
# images use) and replaces what runs. The build is `docker buildx` in the dind service, emulating arm64
# with QEMU, pushing both architectures under one tag with the SBOM and provenance attestations.
# The steps live in scripts/ci_image_build.sh, which also runs on a laptop (README, "Container image").
docker-build:
  extends: .dind
  stage: build
  timeout: 45m
  script:
    - sh scripts/ci_image_build.sh
  artifacts:
    expire_in: 1 week
    paths:
      # IMAGE_REF (name@digest) and IMAGE_TAG for the scan job.
      - build.env

# The scan of exactly the digest that was pushed, both architectures. It fails on a HIGH or CRITICAL
# vulnerability that has a fix; unfixed findings stay in the report. A failure means: bump the pinned
# base image in the Dockerfile, do not retry. The CycloneDX SBOM per architecture is the job's artifact.
# `rules:` come from the shared job, so the scan runs whenever the build does.
image-scan:
  extends: docker-build
  stage: build
  needs: [docker-build]
  timeout: 20m
  image:
    name: aquasec/trivy:0.76.2
    entrypoint: [""]
  services: []
  before_script: []
  variables:
    ARTIFACTS_DIR: artifacts
  script:
    - set -a && . ./build.env && set +a
    - sh scripts/ci_image_scan.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - artifacts/
    reports:
      cyclonedx:
        - artifacts/sbom-amd64.cdx.json
        - artifacts/sbom-arm64.cdx.json

# The full history, not only the pushed commits, with the repository's gitleaks config: `main` is
# mirrored to a public repository, so a secret anywhere in its history is published. GitLab's
# Secret-Detection job above scans the pushed range with GitLab's ruleset; this one is the gate the
# mirror relies on. A finding fails the pipeline: remove the secret (and rotate it), never allowlist it.
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

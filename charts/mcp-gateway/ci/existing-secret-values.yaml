# Configuration in a Secret managed elsewhere.
image:
  repository: registry.example.com/team/mcp-gateway
replicaCount: 2
existingSecret:
  name: mcp-gateway-config
  sharedState: true
terminationGracePeriodSeconds: 180
secretMounts:
- name: secrets
  secretName: mcp-gateway-secrets
  mountPath: /run/gateway/secrets
